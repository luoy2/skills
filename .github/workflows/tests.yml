name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The questionnaire hook runs under node, as Claude Code runs it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv run --python 3.12 --with pytest python -m pytest -q tests
